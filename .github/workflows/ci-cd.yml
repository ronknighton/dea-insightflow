name: CI/CD

# Runs tests on every PR against main (the gate) and on every push to main
# (deploy). This is the minimum CI/CD bar confirmed by the SME: a working
# workflow for deployable components (Lambda/Glue).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC - this is what lets AWS trust the token, no stored secrets
  contents: read

jobs:
  test:
    name: Lint & test Lambdas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add each new lambdas/<folder> here as they're built. Kept explicit
        # rather than auto-discovered so a broken/incomplete folder can't
        # silently fail the whole matrix.
        lambda_dir:
          - crm_webhook_handler
          - calendly_webhook_handler
          - crm_consumer_handler
          - calendly_spend_handler
          - wistia_handler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the deployed Lambda runtime (infrastructure/crm-webhook-api.yaml)

      - name: Install dependencies
        working-directory: lambdas/${{ matrix.lambda_dir }}
        run: |
          python -m pip install --upgrade pip
          # pandas/awswrangler only needed by crm_consumer_handler (provided
          # via the AWSSDKPandas Lambda layer at runtime, not this zip) -
          # installed for every lambda_dir here anyway, simpler than a
          # per-matrix conditional and harmless for the others.
          pip install boto3 pytest pandas awswrangler

      - name: Syntax check
        working-directory: lambdas/${{ matrix.lambda_dir }}
        run: python -m py_compile lambda_function.py

      - name: Run tests
        working-directory: lambdas/${{ matrix.lambda_dir }}
        env:
          AWS_DEFAULT_REGION: us-east-1 # dummy region so boto3 clients construct; no real AWS calls in tests
        run: python -m pytest test_lambda_function.py -v

  test-glue:
    name: Lint & test Glue jobs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same explicit-list pattern as lambda_dir above, for the same reason.
        glue_dir:
          - calendly_transform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # matches the deployed Glue Python Shell runtime (infrastructure/calendly-transform-job.yaml)

      - name: Install dependencies
        working-directory: glue_jobs/${{ matrix.glue_dir }}
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest pandas awswrangler

      - name: Syntax check
        working-directory: glue_jobs/${{ matrix.glue_dir }}
        run: python -m py_compile script.py

      - name: Run tests
        working-directory: glue_jobs/${{ matrix.glue_dir }}
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest test_script.py -v

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lambda_dir:
          - crm_webhook_handler
          - calendly_webhook_handler
          - crm_consumer_handler
          - calendly_spend_handler
          - wistia_handler
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022868553110:role/insightflow-github-actions-deploy-role
          aws-region: us-east-1

      - name: Package Lambda
        working-directory: lambdas/${{ matrix.lambda_dir }}
        run: zip -r ../${{ matrix.lambda_dir }}.zip lambda_function.py

      - name: Deploy Lambda code
        run: |
          FUNCTION_NAME="insightflow-${{ matrix.lambda_dir }}"
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://lambdas/${{ matrix.lambda_dir }}.zip
          else
            echo "::warning::Function $FUNCTION_NAME does not exist yet - skipping deploy. Provision it in CloudFormation first, then this step will pick it up on the next merge."
          fi

  deploy-glue:
    name: Deploy Glue scripts to S3
    needs: test-glue
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        glue_dir:
          - calendly_transform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::022868553110:role/insightflow-github-actions-deploy-role
          aws-region: us-east-1

      - name: Upload Glue script to S3
        # Unlike Lambda, a Glue Job resource has no "placeholder code"
        # option - ScriptLocation must point at a real object from stack
        # creation onward. This step just syncs the file; CloudFormation
        # itself doesn't need to change or re-run for the Glue job to pick
        # up the new script on its next scheduled invocation.
        run: |
          aws s3 cp glue_jobs/${{ matrix.glue_dir }}/script.py \
            s3://insightflow-project-022868553110/glue-scripts/${{ matrix.glue_dir }}/script.py