AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions deploy role for InsightFlow: creates a repo-scoped IAM role
  trusted via OIDC, using the GitHub OIDC provider already registered in this
  AWS account (by the Global Partners capstone). Deployed manually - see
  infrastructure/foundation.yaml for why the first deploy of anything OIDC-
  related can't itself go through GitHub Actions.

Parameters:
  GitHubOrg:
    Type: String
    Default: ronknighton
    Description: GitHub username or org that owns the repository.
  GitHubRepo:
    Type: String
    Default: dea-insightflow
    Description: Repository name.
  GitHubOwnerId:
    Type: String
    Default: "28845975"
    Description: Numeric GitHub owner ID (immutable subject claim format, repos created after July 15, 2026).
  GitHubRepoId:
    Type: String
    Default: "1329863690"
    Description: Numeric GitHub repository ID (immutable subject claim format).
  ProjectName:
    Type: String
    Default: insightflow
    Description: Must match the prefix used in foundation.yaml.

Resources:

  # ---------------------------------------------------------------------------
  # NOTE: the GitHub OIDC provider itself is NOT created here. It's a
  # singleton per AWS account (one provider per URL, account-wide) - the
  # Global Partners capstone already registered it. Re-declaring it here
  # fails with AlreadyExists, which is expected and correct: multiple
  # projects are meant to share the one provider registration while each
  # gets its own narrowly-trusted role below.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Deploy role - trust is scoped to this exact repo via the sub claim
  # condition, not just to "any GitHub Actions token". Branch is unrestricted
  # (ref:refs/heads/*) so both PR-triggered and main-branch runs can assume
  # it; the workflow itself only calls deploy actions on the main-branch job.
  # ---------------------------------------------------------------------------
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-actions-deploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Immutable subject claim format (GitHub, July 15 2026+): the sub
                # embeds numeric owner/repo IDs, not just mutable names, so a
                # recycled username/repo name can't inherit this trust. Pinned to
                # the main branch specifically - the deploy job (the only step
                # that assumes this role) only ever runs on pushes to main, so
                # nothing broader is needed. Widen to :* if a workflow_dispatch
                # or other-branch deploy path is added later.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-lambda-code
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UpdateLambdaCode
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*"
              - Sid: DeployGlueScripts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-project-${AWS::AccountId}/glue-scripts/*"
              - Sid: UpdateGlueJobs
                Effect: Allow
                Action:
                  - glue:GetJob
                  - glue:UpdateJob
                Resource: !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${ProjectName}-*"

Outputs:
  GitHubActionsDeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Description: Set this as the role-to-assume in the GitHub Actions workflow.
