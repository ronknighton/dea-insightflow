AWSTemplateFormatVersion: "2010-09-09"
Description: >
  InsightFlow foundation stack: S3 medallion bucket, SQS delay queue + DLQ for the CRM lead
  flow, placeholder Secrets Manager secrets, and least-privilege IAM roles for every Lambda
  and Glue component in the design (Sections 4-8 of the InsightFlow Solution Design doc).
  Deployed manually (CLI/console) as a one-time bootstrap; not part of the GitHub Actions
  pipeline, which covers Lambda/Glue code deploys only.

Parameters:
  ProjectName:
    Type: String
    Default: insightflow
    Description: Lowercase, used as a prefix for all resource names.

Resources:

  # ---------------------------------------------------------------------------
  # S3 - single medallion bucket, prefix-partitioned (raw/ processed/ marts/)
  # ---------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-project-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended

  # ---------------------------------------------------------------------------
  # SQS - CRM lead delay queue + DLQ (Section 6)
  # ---------------------------------------------------------------------------
  CrmLeadDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-crm-lead-dlq"
      MessageRetentionPeriod: 1209600 # 14 days, max - gives time to inspect failures

  CrmLeadDelayQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-crm-lead-delay-queue"
      DelaySeconds: 0 # per-message DelaySeconds is set by the sender (600s), not the queue default
      VisibilityTimeout: 120 # must exceed consumer Lambda's expected runtime
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CrmLeadDLQ.Arn
        maxReceiveCount: 3

  CrmLeadDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-crm-lead-dlq-not-empty"
      AlarmDescription: Fires when a CRM lead message lands in the DLQ after 3 failed processing attempts.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CrmLeadDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------------
  # Secrets Manager - placeholders. Values are set post-deploy, never in this
  # template or in code. Do not put real tokens/secrets in source control.
  # ---------------------------------------------------------------------------
  CrmWebhookSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/close-webhook-signing-secret"
      Description: Close-Sig-Hash signing secret for validating inbound CRM webhook requests.
      SecretString: "REPLACE_ME_AFTER_DEPLOY"

  CalendlyWebhookSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/calendly-webhook-signing-secret"
      Description: Calendly signing secret for validating inbound booking webhook requests.
      SecretString: "REPLACE_ME_AFTER_DEPLOY"

  WistiaApiToken:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/wistia-api-token"
      Description: Wistia Stats API token (Basic Auth).
      SecretString: "REPLACE_ME_AFTER_DEPLOY"

  SlackWebhookUrl:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/slack-webhook-url"
      Description: >
        Incoming webhook URL for CRM lead notifications. Personal Slack
        workspace for now - see Section 14, Item 6 of the design doc for
        the open question on whether this should move to the shared DEA
        workspace instead. Swapping the URL here requires no code change.
      SecretString: "REPLACE_ME_AFTER_DEPLOY"

  # ---------------------------------------------------------------------------
  # IAM - one role per component, scoped to only the prefixes/resources it
  # actually touches. No role gets bucket-wide access.
  # ---------------------------------------------------------------------------

  # 1. CRM webhook Lambda: API Gateway -> Lambda. Writes raw/crm_events/,
  #    sends the delayed message, reads its own signing secret.
  CrmWebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-crm-webhook-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crm-webhook-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteRawCrmEvents
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/raw/crm_events/*"
              - Sid: SendDelayedMessage
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CrmLeadDelayQueue.Arn
              - Sid: ReadOwnSigningSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CrmWebhookSigningSecret
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-crm_webhook_handler*"

  # 2. CRM consumer Lambda: triggered by the delay queue after 10 min.
  #    Reads raw event, writes enriched Parquet. Lookup bucket is public/
  #    anonymous, so no IAM permission is needed for it.
  CrmConsumerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-crm-consumer-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crm-consumer-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeDelayQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CrmLeadDelayQueue.Arn
              - Sid: ReadRawCrmEvent
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/raw/crm_events/*"
              - Sid: ListBucketForIdempotencyCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "processed/crm_leads_enriched/*"
              - Sid: ReadProcessedForIdempotencyCheck
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/processed/crm_leads_enriched/*"
              - Sid: WriteProcessedCrmLeads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/processed/crm_leads_enriched/*"
              - Sid: ReadSlackWebhookSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SlackWebhookUrl
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-crm_consumer_handler*"

  # 3. Calendly webhook Lambda: writes raw booking events, reads its own secret.
  CalendlyWebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-calendly-webhook-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: calendly-webhook-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteRawCalendlyEvents
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/raw/calendly_webhook_events/*"
              - Sid: ReadOwnSigningSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CalendlyWebhookSigningSecret
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-calendly_webhook_handler*"

  # 4. Calendly spend Lambda: EventBridge-scheduled daily pull of the public
  #    spend file. Source is a public URL, so no IAM permission needed for it.
  CalendlySpendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-calendly-spend-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: calendly-spend-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteRawCalendlySpend
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/raw/calendly_spend/*"
              - Sid: ListBucketForIdempotencyCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "raw/calendly_spend/*"
              - Sid: ReadRawCalendlySpendForIdempotencyCheck
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/raw/calendly_spend/*"
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-calendly_spend_handler*"

  # 5. Wistia Lambda: EventBridge-scheduled pull. Reads/writes its own SSM
  #    watermark parameter, reads its API token, writes raw Wistia stats.
  WistiaLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-wistia-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: wistia-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteRawWistiaStats
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/raw/wistia_stats/*"
              - Sid: ReadWriteWatermark
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/wistia/watermark/*"
              - Sid: ReadApiToken
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WistiaApiToken
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-wistia*"

  # 6. Glue transform job: reads raw/, writes processed/ only. Does not
  #    touch marts/ - that's written by Athena CTAS, not Glue.
  GlueTransformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-transform-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: glue-transform-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucketForRawAndProcessed
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - "raw/*"
                      - "processed/*"
              - Sid: ReadRaw
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/raw/*"
              - Sid: ReadGlueScripts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/glue-scripts/*"
              - Sid: WriteProcessed
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${DataBucket.Arn}/processed/*"
              - Sid: GlueCatalogAccess
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:BatchCreatePartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ProjectName}*"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}*/*"
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*"

  # 7. Glue crawler: read-only across all three layers, to register schema.
  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-crawler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: glue-crawler-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucketAllLayers
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - "raw/*"
                      - "processed/*"
                      - "marts/*"
              - Sid: ReadAllLayers
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${DataBucket.Arn}/raw/*"
                  - !Sub "${DataBucket.Arn}/processed/*"
                  - !Sub "${DataBucket.Arn}/marts/*"
              - Sid: GlueCatalogWrite
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:CreateDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:BatchCreatePartition
                  - glue:BatchGetPartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ProjectName}*"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}*/*"
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*"

  # 8. Marts builder Lambda: runs CTAS queries against Athena to compute
  #    the business metrics in marts/, per Section 9/10 of the design doc.
  MartsBuilderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-marts-builder-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: marts-builder-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunAthenaQueries
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${ProjectName}-workgroup"
              - Sid: GetBucketLocationForAthena
                # Distinct, bucket-level permission Athena requires before
                # it will run ANY query - not covered by ListBucket or
                # object-level Get/Put. Athena uses this to confirm which
                # region the output bucket lives in. Missing this produces
                # "InvalidRequestException: Unable to verify/create output
                # bucket" on every single query, at the very first API
                # call, before any SQL is even evaluated - a well-
                # documented, common gap, confirmed against this exact
                # error message hit in production on the first real run.
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt DataBucket.Arn
              - Sid: ListBucketForCtasAndCleanup
                # ListBucket included from the start this time - the CRM
                # consumer's 403-masking-404 debugging session earlier in
                # this project made clear this is needed for HeadObject/
                # object-existence checks, and CTAS's drop-and-delete-
                # before-recreate pattern needs to list marts/ objects to
                # delete them.
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - "processed/*"
                      - "marts/*"
                      - "athena-results/*"
              - Sid: ReadProcessedForQueries
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/processed/*"
              - Sid: ReadWriteDeleteMarts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${DataBucket.Arn}/marts/*"
              - Sid: ReadWriteAthenaResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/athena-results/*"
              - Sid: GlueCatalogReadWrite
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:BatchCreatePartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ProjectName}*"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}*/*"
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-marts_builder*"

Outputs:
  BucketName:
    Value: !Ref DataBucket
    Export: { Name: !Sub "${ProjectName}-bucket-name" }
  BucketArn:
    Value: !GetAtt DataBucket.Arn
    Export: { Name: !Sub "${ProjectName}-bucket-arn" }
  CrmLeadDelayQueueUrl:
    Value: !Ref CrmLeadDelayQueue
    Export: { Name: !Sub "${ProjectName}-crm-delay-queue-url" }
  CrmLeadDelayQueueArn:
    Value: !GetAtt CrmLeadDelayQueue.Arn
    Export: { Name: !Sub "${ProjectName}-crm-delay-queue-arn" }
  CrmLeadDLQUrl:
    Value: !Ref CrmLeadDLQ
    Export: { Name: !Sub "${ProjectName}-crm-dlq-url" }
  CrmWebhookLambdaRoleArn:
    Value: !GetAtt CrmWebhookLambdaRole.Arn
    Export: { Name: !Sub "${ProjectName}-crm-webhook-lambda-role-arn" }
  CrmConsumerLambdaRoleArn:
    Value: !GetAtt CrmConsumerLambdaRole.Arn
    Export: { Name: !Sub "${ProjectName}-crm-consumer-lambda-role-arn" }
  CalendlyWebhookLambdaRoleArn:
    Value: !GetAtt CalendlyWebhookLambdaRole.Arn
    Export: { Name: !Sub "${ProjectName}-calendly-webhook-lambda-role-arn" }
  CalendlySpendLambdaRoleArn:
    Value: !GetAtt CalendlySpendLambdaRole.Arn
    Export: { Name: !Sub "${ProjectName}-calendly-spend-lambda-role-arn" }
  WistiaLambdaRoleArn:
    Value: !GetAtt WistiaLambdaRole.Arn
    Export: { Name: !Sub "${ProjectName}-wistia-lambda-role-arn" }
  GlueTransformRoleArn:
    Value: !GetAtt GlueTransformRole.Arn
    Export: { Name: !Sub "${ProjectName}-glue-transform-role-arn" }
  GlueCrawlerRoleArn:
    Value: !GetAtt GlueCrawlerRole.Arn
    Export: { Name: !Sub "${ProjectName}-glue-crawler-role-arn" }
  MartsBuilderLambdaRoleArn:
    Value: !GetAtt MartsBuilderLambdaRole.Arn
    Export: { Name: !Sub "${ProjectName}-marts-builder-lambda-role-arn" }
  CrmWebhookSigningSecretArn:
    Value: !Ref CrmWebhookSigningSecret
    Export: { Name: !Sub "${ProjectName}-crm-webhook-signing-secret-arn" }
  CalendlyWebhookSigningSecretArn:
    Value: !Ref CalendlyWebhookSigningSecret
    Export: { Name: !Sub "${ProjectName}-calendly-webhook-signing-secret-arn" }
  WistiaApiTokenSecretArn:
    Value: !Ref WistiaApiToken
    Export: { Name: !Sub "${ProjectName}-wistia-api-token-secret-arn" }
  SlackWebhookUrlSecretArn:
    Value: !Ref SlackWebhookUrl
    Export: { Name: !Sub "${ProjectName}-slack-webhook-url-secret-arn" }